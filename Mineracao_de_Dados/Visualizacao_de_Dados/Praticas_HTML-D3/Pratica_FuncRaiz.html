<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Centralização da Figura. -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .copyright {
            margin-top: 30px;
            font-family: Helvetica, sans-serif;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Plano normalizado 0 0 1 1. -->
        <svg width="500" height="500" viewBox="0 0 1 1">
            <!-- Grid -->
            <defs>
                <!-- 
                    Padrão: dividir o SVG em grid com retângulos 10 x 10 (10%).
                    patterUnits: sistema de coordenadas do usuário.
                -->
                <pattern id="grid" width="0.1" height="0.1" patternUnits="userSpaceOnUse">
                    <rect width="0.1" height="0.1" fill="none" stroke="#d4a574" stroke-width="0.002"/>
                </pattern>
            </defs>

            <!-- Cria um retângulo de 1x1 (tela inteira) e aplica o padrão. -->
            <rect width="1" height="1" fill="url(#grid)"/>
            
            <!-- Borda. -->
            <rect width="1" height="1" fill="none" stroke="#b8860b" stroke-width="0.009"/>
            
            <text x="0.05" y="0.085" font-size="0.05" font-family="Helvetica">(0,1)</text>
            <text x="0.85" y="0.085" font-size="0.05" font-family="Helvetica">(1,1)</text>
            <text x="0.05" y="0.95" font-size="0.05" font-family="Helvetica">(0,0)</text>
            <text x="0.85" y="0.95" font-size="0.05" font-family="Helvetica">(1,0)</text>
            
            <!-- Legendas Eixos x e y. -->
            <text x="0.5" y="0.95" font-size="0.05" font-family="Helvetica">x</text>
            <text x="0.04" y="0.5" font-size="0.05" font-family="Helvetica">y</text>
            
            <text x="0.45" y="0.06" font-size="0.03" font-family="Helvetica">y = √x</text>

            <!-- SVG interno normalizado 0 0 1 1 (80% do externo). -->
            <svg x="0.1" y="0.1" width="0.8" height="0.8" viewBox="0 0 1 1" overflow="visible">
                
                <!-- Área azul. -->
                <rect x="0" y="0" width="1" height="1" fill="#a8c5dd" />
                
                <!-- Eixo X (horizontal na base). -->
                <line x1="0" y1="1" x2="1" y2="1" stroke="black" stroke-width="0.006"/>
                
                <!-- Eixo Y (vertical na esquerda). -->
                <line x1="0" y1="0" x2="0" y2="1" stroke="black" stroke-width="0.006"/>
                
            <!-- Plotar função y = √x. -->
                <!-- Lembre-se: em SVG, Y cresce para baixo, então plotamos (x, 1-y). -->
                <polyline 
                    points="
                        0,1
                        0.02,0.859
                        0.04,0.8
                        0.06,0.755
                        0.08,0.717
                        0.1,0.684
                        0.12,0.654
                        0.14,0.626
                        0.16,0.6
                        0.18,0.576
                        0.2,0.553
                        0.22,0.531
                        0.24,0.51
                        0.26,0.49
                        0.28,0.471
                        0.3,0.452
                        0.32,0.435
                        0.34,0.417
                        0.36,0.4
                        0.38,0.384
                        0.4,0.368
                        0.42,0.352
                        0.44,0.337
                        0.46,0.322
                        0.48,0.308
                        0.5,0.293
                        0.52,0.279
                        0.54,0.265
                        0.56,0.252
                        0.58,0.239
                        0.6,0.225
                        0.62,0.213
                        0.64,0.2
                        0.66,0.188
                        0.68,0.176
                        0.7,0.163
                        0.72,0.151
                        0.74,0.14
                        0.76,0.128
                        0.78,0.117
                        0.8,0.106
                        0.82,0.095
                        0.84,0.083
                        0.86,0.073
                        0.88,0.062
                        0.9,0.053
                        0.92,0.041
                        0.94,0.032
                        0.96,0.02
                        0.98,0.01
                        1,0
                    " 
                    fill="none" 
                    stroke="darkblue" 
                    stroke-width="0.004"
                />
            </svg>
        </svg>
        
        <!-- Copyright embaixo do SVG -->
        <div class="copyright">
            Tony Esaú © Direitos Reservados
        </div>
    </div>
</body>
</html>
