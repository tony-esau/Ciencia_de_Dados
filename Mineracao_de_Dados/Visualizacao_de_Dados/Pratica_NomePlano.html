<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Centralização da Figura. -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .copyright {
            margin-top: 30px;
            font-family: Helvetica, sans-serif;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Plano normalizado 0 0 1 1. -->
        <svg width="500" height="500" viewBox="0 0 1 1">
            <!-- Grid -->
            <defs>
                <!-- 
                    Padrão: dividir o SVG em grid com retângulos 10 x 10 (10%).
                    patterUnits: sistema de coordenadas do usuário.
                -->
                <pattern id="grid" width="0.05" height="0.05" patternUnits="userSpaceOnUse">
                    <rect width="0.1" height="0.1" fill="none" stroke="#d4a574" stroke-width="0.002"/>
                </pattern>
            </defs>

            <!-- Cria um retângulo de 1x1 (tela inteira) e aplica o padrão. -->
            <rect width="1" height="1" fill="url(#grid)"/>
            
            <!-- Borda. -->
            <rect width="1" height="1" fill="none" stroke="#b8860b" stroke-width="0.009"/>
            
            <!-- T -->
            <path d="M  0.15 0.35 
                        0.30 0.35
                        0.30 0.40
                        0.25 0.40
                        0.25 0.50
                        0.20 0.50
                        0.20 0.40
                        0.15 0.40
                        Z
                    "
                  fill="#87CEFA" stroke="blue" stroke-width="0.004"
            />
            
            <!-- 0 -->
            <path d="M  0.35 0.35
                        0.35 0.50
                        0.50 0.50
                        0.50 0.35
                        Z
                    "
                  fill="#87CEFA" stroke="blue" stroke-width="0.004"
            />
            
            <!-- centro -->
            <path d="M  0.4 0.4
                        0.4 0.45
                        0.45 0.45
                        0.45 0.40
                        Z
                    "
                  fill="#f0f0f0" stroke="blue" stroke-width="0.004"
            />
            
            <!-- N -->
            <path d="M  0.55 0.35
                        0.55 0.50
                        0.60 0.50
                        0.60 0.45
                        0.67 0.50
                        0.70 0.50
                        0.70 0.35
                        0.65 0.35
                        0.65 0.43
                        Z
                    "
                  fill="#87CEFA" stroke="blue" stroke-width="0.004"
            />
            
            <!-- Y -->
            <path d="M  0.75 0.35
                        0.75 0.40
                        0.80 0.40
                        0.80 0.50
                        0.85 0.50
                        0.85 0.40
                        0.90 0.40
                        0.90 0.35
                        0.85 0.35
                        0.85 0.39
                        0.80 0.39
                        0.80 0.35
                        Z
                    "
                  fill="#87CEFA" stroke="blue" stroke-width="0.004"
            />
            
        </svg>
        
        <div class="copyright">
            Tony Esaú © Direitos Reservados
        </div>
    </div>
</body>
</html>
